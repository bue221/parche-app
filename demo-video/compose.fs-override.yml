# Demo-only: MinIO quay pull is broken; stub the service and use local fs store.
services:
  api:
    environment:
      OBJECT_STORE_DRIVER: fs
      OBJECT_STORE_PATH: /data/media
      OBJECT_STORE_PUBLIC_BASE_URL: http://localhost:8080/media
      # Demo recording: fake checkout so Playwright can complete purchase + QR.
      PAYMENT_PROVIDER: fake
    volumes:
      - api_media:/data/media

  worker:
    environment:
      OBJECT_STORE_DRIVER: fs
      OBJECT_STORE_PATH: /data/media
      OBJECT_STORE_PUBLIC_BASE_URL: http://localhost:8080/media
      PAYMENT_PROVIDER: fake
    volumes:
      - api_media:/data/media

  minio:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    environment: {}
    ports: []
    volumes: []

volumes:
  api_media:
