openapi: 3.0.3
info:
  title: Parche API
  version: 0.7.0
  description: >
    Product HTTP contract. All product routes live under /v1, speak JSON,
    echo X-Request-Id, and fail with the Error envelope. Update this file
    in the same change as each new Go route.
servers:
  - url: http://localhost:8080
    description: Local Compose
paths:
  /health:
    get:
      summary: Process liveness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /ready:
    get:
      summary: Dependency readiness
      operationId: getReady
      security: []
      responses:
        "200":
          description: Postgres, Redis, and object store respond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ready
        "503":
          $ref: "#/components/responses/NotReady"
  /v1/events:
    get:
      summary: Public event list with optional bbox (F07 filter, F08 catalog)
      operationId: listEvents
      security: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MinLat"
        - $ref: "#/components/parameters/MinLng"
        - $ref: "#/components/parameters/MaxLat"
        - $ref: "#/components/parameters/MaxLng"
      responses:
        "200":
          description: Cursor page of published events. Each item includes WGS84 lat/lng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
              example:
                items: []
                next_cursor: null
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/venues:
    get:
      summary: List venues (F07)
      operationId: listVenues
      security: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: tenant_id
          in: query
          description: Member-only list of that colectivo's venues (including unpublished)
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/MinLat"
        - $ref: "#/components/parameters/MinLng"
        - $ref: "#/components/parameters/MaxLat"
        - $ref: "#/components/parameters/MaxLng"
      responses:
        "200":
          description: Public venues with at least one published event, or tenant venues when tenant_id is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create a venue pin in a tenant (F07)
      operationId: createVenue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
            example:
              tenant_id: "0199a0c0-0000-7000-8000-000000000010"
              name: Video Club
              address_text: Chapinero, Bogotá
              lat: 4.65
              lng: -74.06
      responses:
        "201":
          description: Venue stored with user_pin source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
  /v1/venues/{id}:
    get:
      summary: Get a venue (F07)
      operationId: getVenue
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public if a published event uses it; otherwise tenant member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update venue (tenant owner or staff) (F07)
      operationId: patchVenue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVenueRequest"
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
  /v1/auth/register:
    post:
      summary: Register (F04)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: ada@example.com
              password: correct-horse
              display_name: Ada
              profile: attendee
      responses:
        "201":
          description: Session tokens and public user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/login:
    post:
      summary: Login (F04)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session tokens and public user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/refresh:
    post:
      summary: Rotate refresh (F04)
      operationId: refreshSession
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access and refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/logout:
    post:
      summary: Revoke refresh family (F04)
      operationId: logout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
		"204":
          description: Family revoked (idempotent)
  /v1/auth/password/forgot:
    post:
      summary: Start password recovery (F05)
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            example:
              email: ada@example.com
      responses:
        "204":
          description: Always no content (does not reveal whether the email exists)
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/password/reset:
    post:
      summary: Complete password recovery (F05)
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              token: url-safe-one-use-token
              password: new-correct-horse
      responses:
        "204":
          description: Password updated; caller must log in again
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/me:
    get:
      summary: Current user (F04)
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profiles, optional tenant, membership summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/profiles/artist:
    post:
      summary: Add artist platform profile (F06)
      operationId: addArtistProfile
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Idempotent; does not create the public artist document (F12)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/sessions:
    get:
      summary: List refresh families (F04)
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions without hashes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Revoke all refresh families (F04)
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tenants:
    post:
      summary: Create a colectivo (F06)
      operationId: createTenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
            example:
              name: Pez Alado
      responses:
        "201":
          description: Tenant plus owner membership for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{id}:
    get:
      summary: Get a tenant the caller belongs to (F06)
      operationId: getTenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update tenant name or currency (owner) (F06)
      operationId: patchTenant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTenantRequest"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}/members:
    get:
      summary: List tenant members (owner) (F06)
      operationId: listTenantMembers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Members of the colectivo (not event_members)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Invite staff by user_id or email (owner) (F06)
      operationId: addTenantMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTenantMemberRequest"
      responses:
        "201":
          description: Immediate staff membership when the user already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}/members/{userId}:
    delete:
      summary: Remove a tenant member (owner) (F06)
      operationId: removeTenantMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      summary: Issue a short-lived PUT presign (F03)
      operationId: createUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
            example:
              kind: flyer
              content_type: image/jpeg
              byte_size: 1200000
              event_id: "0199a0c0-0000-7000-8000-000000000010"
      responses:
        "200":
          description: Server-generated key and PUT grant (5 minute TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
              example:
                key: 0199a0c0-0000-7000-8000-000000000020/0199a0c0-0000-7000-8000-000000000010/flyer/0199a0c0-0000-7000-8000-000000000030.webp
                upload:
                  method: PUT
                  url: https://minio.example/parche/...?X-Amz-Signature=redacted
                  headers:
                    Content-Type: image/jpeg
                  expires_at: "2026-09-11T19:35:00Z"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}/check-in:
    post:
      summary: Door check-in (F19)
      operationId: checkIn
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan result (implemented in F19)
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    MinLat:
      name: min_lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    MinLng:
      name: min_lng
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
    MaxLat:
      name: max_lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    MaxLng:
      name: max_lng
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - GONE
            - RATE_LIMITED
            - NOT_READY
            - INTERNAL
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
      example:
        code: FORBIDDEN
        message: No tienes permiso de puerta en este evento
        request_id: "0199a0c0-0000-7000-8000-000000000001"
    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string
      example:
        field: ends_at
        issue: order
    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventMapItem"
        next_cursor:
          type: string
          nullable: true
    EventMapItem:
      type: object
      required: [id, lat, lng]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        lat:
          type: number
          description: WGS84. Required on published events.
        lng:
          type: number
        venue_id:
          type: string
          format: uuid
        address_text:
          type: string
    Venue:
      type: object
      required: [id, tenant_id, name, address_text, lat, lng, source]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        address_text:
          type: string
        lat:
          type: number
        lng:
          type: number
        geojson:
          description: Optional GeoJSON Point or Polygon. Never Google Places.
          type: object
        source:
          type: string
          enum: [user_pin]
        created_at:
          type: string
          format: date-time
    VenueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        next_cursor:
          type: string
          nullable: true
    CreateVenueRequest:
      type: object
      required: [tenant_id, name, lat, lng]
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        address_text:
          type: string
        lat:
          type: number
        lng:
          type: number
        geojson:
          type: object
        source:
          type: string
          enum: [user_pin]
    PatchVenueRequest:
      type: object
      properties:
        name:
          type: string
        address_text:
          type: string
        lat:
          type: number
        lng:
          type: number
        geojson:
          type: object
          nullable: true
    RegisterRequest:
      type: object
      required: [email, password, display_name, profile]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        display_name:
          type: string
        profile:
          type: string
          enum: [attendee, promoter]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Opaque refresh; web may send httpOnly cookie `refresh` instead
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
    PublicUser:
      type: object
      required: [id, email, display_name, profiles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        profiles:
          type: array
          items:
            type: string
    Session:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, user]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/PublicUser"
    Me:
      type: object
      required: [id, email, display_name, profiles, tenants, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        profiles:
          type: array
          items:
            type: string
        tenant:
          $ref: "#/components/schemas/TenantView"
          nullable: true
          description: First tenant membership; prefer tenants[]
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantView"
        memberships:
          type: array
          items:
            type: object
            required: [event_id, role, status]
            properties:
              event_id:
                type: string
              role:
                type: string
              status:
                type: string
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, created_at, user_agent, current]
            properties:
              id:
                type: string
              created_at:
                type: string
                format: date-time
              user_agent:
                type: string
              current:
                type: boolean
    TenantView:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, staff]
    Tenant:
      type: object
      required: [id, slug, name, currency, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        currency:
          type: string
          example: COP
        status:
          type: string
          enum: [active]
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    PatchTenantRequest:
      type: object
      properties:
        name:
          type: string
        currency:
          type: string
    AddTenantMemberRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    TenantMember:
      type: object
      required: [user_id, email, display_name, role]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [owner, staff]
    TenantMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantMember"
    UploadRequest:
      type: object
      required: [kind, content_type, byte_size]
      properties:
        kind:
          type: string
          enum: [flyer, gallery, avatar, audio]
        content_type:
          type: string
        byte_size:
          type: integer
          format: int64
        event_id:
          type: string
          format: uuid
          nullable: true
    UploadResponse:
      type: object
      required: [key, upload]
      properties:
        key:
          type: string
        upload:
          type: object
          required: [method, url, headers, expires_at]
          properties:
            method:
              type: string
              example: PUT
            url:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            expires_at:
              type: string
              format: date-time
  responses:
    Error:
      description: Standard product error
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              value:
                code: NOT_FOUND
                message: No encontrado
                request_id: "0199a0c0-0000-7000-8000-000000000001"
            validation:
              value:
                code: VALIDATION_ERROR
                message: La fecha de fin debe ser posterior al inicio
                request_id: "0199a0c0-0000-7000-8000-000000000001"
                details:
                  - field: ends_at
                    issue: order
    Unauthorized:
      description: Missing, expired, or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: No autenticado
            request_id: "0199a0c0-0000-7000-8000-000000000001"
    Forbidden:
      description: Authenticated but insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: No tienes permiso
            request_id: "0199a0c0-0000-7000-8000-000000000001"
    Gone:
      description: Reset, invite, or QR token expired or already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: GONE
            message: El recurso ya no está disponible
            request_id: "0199a0c0-0000-7000-8000-000000000001"
    NotReady:
      description: A runtime dependency failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_READY
            message: El servicio no está listo
            request_id: "0199a0c0-0000-7000-8000-000000000001"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: RATE_LIMITED
            message: Demasiadas solicitudes
            request_id: "0199a0c0-0000-7000-8000-000000000001"
security:
  - bearerAuth: []
