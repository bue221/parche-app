components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    MinLat:
      name: min_lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    MinLng:
      name: min_lng
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
    MaxLat:
      name: max_lat
      in: query
      schema:
        type: number
        minimum: -90
        maximum: 90
    MaxLng:
      name: max_lng
      in: query
      schema:
        type: number
        minimum: -180
        maximum: 180
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - GONE
            - RATE_LIMITED
            - NOT_READY
            - INTERNAL
        message:
