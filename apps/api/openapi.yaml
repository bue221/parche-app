openapi: 3.0.3
info:
  title: Parche API
  version: 0.9.0
  description: >
    Product HTTP contract. All product routes live under /v1, speak JSON,
    echo X-Request-Id, and fail with the Error envelope. Update this file
    in the same change as each new Go route.
servers:
  - url: http://localhost:8080
    description: Local Compose
paths:
  /health:
    get:
      summary: Process liveness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /ready:
    get:
      summary: Dependency readiness
      operationId: getReady
      security: []
      responses:
        "200":
          description: Postgres, Redis, and object store respond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ready
        "503":
          $ref: "#/components/responses/NotReady"
  /v1/events:
    get:
      summary: Public event list with optional bbox (F07 filter, F08 catalog)
      operationId: listEvents
      security: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MinLat"
        - $ref: "#/components/parameters/MinLng"
        - $ref: "#/components/parameters/MaxLat"
        - $ref: "#/components/parameters/MaxLng"
      responses:
        "200":
          description: Cursor page of published events. Each item includes WGS84 lat/lng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
              example:
                items: []
                next_cursor: null
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create an event draft (F08)
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Draft event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/events/{id}:
    get:
      summary: Event detail (F08)
      operationId: getEvent
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published and cancelled are public; drafts only for event members (404 otherwise)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      summary: Update an event (F08)
      operationId: patchEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventRequest"
      responses:
        "200":
          description: Updated event. Date or venue change on published returns pending_review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/submit:
    post:
      summary: Send draft or rejected event to review (F08)
      operationId: submitEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Status is pending_review. Requires a venue pin and a usable flyer.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/cancel:
    post:
      summary: Cancel a published event (F08)
      operationId: cancelEvent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Status is cancelled. Detail remains public; agenda listing drops it.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/ticket-types:
    get:
      summary: List ticket types for an event (F15)
      operationId: listEventTicketTypes
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published events expose on_sale and sold_out. Event members see every status including draft and paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTypeList"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      summary: Replace the ticket type catalog (F15)
      operationId: putEventTicketTypes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutTicketTypesRequest"
            example:
              items:
                - name: Early
                  price_cents: 50000
                  capacity: 40
                  status: on_sale
                - name: Door
                  price_cents: 80000
                  capacity: 60
                  status: draft
      responses:
        "200":
          description: Upserted catalog. Types with sold_count>0 omitted from the list are archived, not deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTypeList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/orders:
    post:
      summary: Create a checkout order (F16)
      operationId: createEventOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              items:
                - ticket_type_id: "0199a0c0-0000-7000-8000-000000000010"
                  quantity: 2
      responses:
        "201":
          description: Pending order with a payment checkout URL. Replay of the same Idempotency-Key returns the original order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutCreated"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/orders/{id}:
    get:
      summary: Get order status and items (F16)
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Buyer or event.metrics.read. No payment instrument data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payments/webhook:
    post:
      summary: Payment provider webhook (F16)
      operationId: paymentWebhook
      security: []
      parameters:
        - name: X-Payment-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix>,v1=<hmac-sha256 hex> over "{unix}.{raw body}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhook"
            example:
              provider_event_id: evt_01
              order_id: "0199a0c0-0000-7000-8000-000000000020"
              status: success
      responses:
        "200":
          description: Accepted. Duplicate provider_event_id is a no-op.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/dev/payments/simulate:
    post:
      summary: Dev-only fake payment (APP_ENV=dev)
      operationId: simulatePayment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [success, failed]
      responses:
        "200":
          description: Signed webhook applied
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/events/{id}/members:
    get:
      summary: List event members (F11)
      operationId: listEventMembers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: user_id, display_name, role, status. Requires event.members.manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Invite a member by email or user_id (F11)
      operationId: inviteEventMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteEventMemberRequest"
      responses:
        "201":
          description: Pending invite. role cannot be owner. Unknown emails stay pending until accept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventInvite"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/members/{userId}:
    patch:
      summary: Change an event member role (F11)
      operationId: patchEventMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventMemberRequest"
      responses:
        "200":
          description: Updated member. Cannot promote to owner or demote the last owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMember"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      summary: Revoke an event member (F11)
      operationId: revokeEventMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: status=revoked. Invalidates Redis ACL. Cannot revoke the last owner.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/transfer-ownership:
    post:
      summary: Transfer event ownership (F11)
      operationId: transferEventOwnership
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipRequest"
      responses:
        "204":
          description: Target becomes owner; caller becomes manager.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/invites/{token}/accept:
    post:
      summary: Accept an event invite (F11)
      operationId: acceptEventInvite
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member is active. Email must match the invite.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/events/{id}/assets:
    post:
      summary: Confirm an uploaded flyer or gallery image (F09)
      operationId: confirmEventAsset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEventAssetRequest"
            example:
              key: 0199a0c0-0000-7000-8000-000000000020/0199a0c0-0000-7000-8000-000000000010/flyer/0199a0c0-0000-7000-8000-000000000030.webp
              kind: flyer
      responses:
        "201":
          description: Asset metadata with public URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventImage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/audio:
    post:
      summary: Confirm an uploaded audio master (F10)
      operationId: confirmEventAudio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEventAudioRequest"
            example:
              key: 0199a0c0-0000-7000-8000-000000000020/0199a0c0-0000-7000-8000-000000000010/audio/0199a0c0-0000-7000-8000-000000000040.wav
      responses:
        "201":
          description: Audio asset metadata without public master URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAudioAsset"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Error"
  /v1/events/{id}/tracks:
    put:
      summary: Replace ordered reference tracks (F10)
      operationId: putEventTracks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutEventTracksRequest"
            example:
              tracks:
                - asset_id: 0199a0c0-0000-7000-8000-000000000041
                  title: Acid jam
                  position: 0
      responses:
        "200":
          description: Ordered track list with signed preview URLs when ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTracksResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/events/{id}/tracks/{trackId}/master:
    get:
      summary: Short-lived signed URL for an audio master (F10)
      operationId: getEventTrackMaster
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: trackId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Presigned GET. Never a public CDN URL. Requires event.write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackMasterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/events/{id}/assets/{assetId}:
    delete:
      summary: Delete an event image (F09)
      operationId: deleteEventAsset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Object and thumbs removed (best-effort). Cannot delete the only flyer of a pending or published event.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}/events:
    get:
      summary: Tenant event list, all statuses (F08)
      operationId: listTenantEvents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor page of the colectivo's events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAdminList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/venues:
    get:
      summary: List venues (F07)
      operationId: listVenues
      security: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: tenant_id
          in: query
          description: Member-only list of that colectivo's venues (including unpublished)
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/MinLat"
        - $ref: "#/components/parameters/MinLng"
        - $ref: "#/components/parameters/MaxLat"
        - $ref: "#/components/parameters/MaxLng"
      responses:
        "200":
          description: Public venues with at least one published event, or tenant venues when tenant_id is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create a venue pin in a tenant (F07)
      operationId: createVenue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
            example:
              tenant_id: "0199a0c0-0000-7000-8000-000000000010"
              name: Video Club
              address_text: Chapinero, Bogotá
              lat: 4.65
              lng: -74.06
      responses:
        "201":
          description: Venue stored with user_pin source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
  /v1/venues/{id}:
    get:
      summary: Get a venue (F07)
      operationId: getVenue
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public if a published event uses it; otherwise tenant member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update venue (tenant owner or staff) (F07)
      operationId: patchVenue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVenueRequest"
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
  /v1/auth/register:
    post:
      summary: Register (F04)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: ada@example.com
              password: correct-horse
              display_name: Ada
              profile: attendee
      responses:
        "201":
          description: Session tokens and public user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
