name: Publish Wiki

# GitHub Wiki is NOT available on private repos with GitHub Free.
# This workflow is manual-only and fails fast with a clear message unless
# the repo has wiki enabled (Pro/Team, or public Free).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wiki availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS_WIKI="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_wiki)"
          if [[ "$HAS_WIKI" != "true" ]]; then
            echo "::notice::GitHub Wiki is disabled (typical on private Free plans)."
            echo "Use docs/ in the repo as the documentation source of truth."
            echo "Upgrade to Pro/Team, or make the repo public, then enable Wiki in Settings."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export WIKI_REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          bash ./scripts/publish-wiki.sh
